<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>terrella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../dist/terrella.css">
<link rel="stylesheet" href="./demo.css">
<script src="./demo-theme.js"></script>
</head>
<body>
<div id="smooth-wrapper">
<div id="smooth-content">

<header class="site-header">
  <div class="container">
    <a class="wordmark" href="./">terrella <span class="version">v0.3.0</span></a>
    <nav class="site-nav" aria-label="Pages">
      <a href="./" aria-current="true">2D canvas</a>
      <a href="./three.html">three.js</a>
      <a href="https://github.com/DamilolaEmmnauel/terrella">GitHub</a>
<button class="theme-switch" type="button" id="theme-toggle" role="switch" aria-checked="false" aria-label="Dark mode">
        <span class="knob" aria-hidden="true">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </span>
      </button>
    </nav>
  </div>
</header>

<main>
  <section class="section container">
    <div class="playground">
      <div>
        <h1 class="section-title">The 2D canvas renderer.</h1>
        <p class="section-lede">
          Drag to spin, flick to throw, hover a marker for its local time. Every
          control is a single call on the instance.
        </p>
        <div class="playground-stage">
          <div class="orrery" id="orrery">
            <div class="globe-layer" id="globe"></div>
            <div class="readout" aria-live="off">
              <span>lon <b id="r-longitude">0.00&deg;</b></span>
              <span>hover <b id="r-hover">none</b></span>
            </div>
          </div>
        </div>
      </div>

      <div class="playground-controls">
        <div class="control">
          <span class="control-label" id="l-style">style</span>
          <div class="segmented" role="group" aria-labelledby="l-style" id="c-style"></div>
        </div>

        <div class="control">
          <span class="control-label" id="l-projection">projection</span>
          <div class="segmented" role="group" aria-labelledby="l-projection" id="c-projection">
            <button type="button" data-projection="orthographic" aria-pressed="true">Globe</button>
            <button type="button" data-projection="naturalEarth" aria-pressed="false">Flat</button>
          </div>
        </div>

        <div class="control">
          <label class="control-label" for="c-region">focus</label>
          <div class="select">
            <select id="c-region">
              <option value="">None, drifting</option>
              <option value="africa">Africa</option>
              <option value="sea">Southeast Asia</option>
              <option value="latam">Latin America</option>
            </select>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>

        <div class="control">
          <span class="control-label" id="l-palette">palette</span>
          <div class="swatches" role="group" aria-labelledby="l-palette" id="c-palette"></div>
        </div>

        <div class="playground-code">
          <span class="control-label">equivalent code</span>
          <pre><code id="live-code"></code></pre>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <span>MIT &copy; 2026 <a href="https://github.com/DamilolaEmmnauel">Damilola Akinosun</a></span>
    <span data-live>renderer: 2D canvas</span>
  </div>
</footer>

</div>
</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/ScrollTrigger.min.js"></script>
<script src="../node_modules/gsap/dist/ScrollSmoother.min.js"></script>
<script src="./demo-data.js"></script>
<script src="../dist/terrella.global.js"></script>
<script>
(async () => {
  "use strict";

  const world = await (await fetch("../data/countries-110m.json")).json();
  const { REGIONS, MARKERS, PALETTES, ringMarkup } = window.TERRELLA_DEMO;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (selector) => document.querySelector(selector);

  gsap.registerPlugin(ScrollTrigger, ScrollSmoother);
  if (!reduced) ScrollSmoother.create({ smooth: 1.1, effects: false, normalizeScroll: true });

  const theme = window.TERRELLA_THEME;
  const base = () => (theme.current() === "dark" ? "ink" : "chart");
  /**
   * The controls live in the URL hash, so a configured globe is a link:
   *   demo/#style=dots&projection=naturalEarth&region=sea&palette=ink
   */
  const fromUrl = new URLSearchParams(location.hash.slice(1));
  const state = {
    style: fromUrl.get("style") || "solid",
    projection: fromUrl.get("projection") || "orthographic",
    region: fromUrl.get("region") || "",
    palette: fromUrl.get("palette") || base(),
  };
  function writeUrl() {
    const params = new URLSearchParams();
    for (const [key, value] of Object.entries(state)) if (value) params.set(key, value);
    history.replaceState(null, "", `#${params}`);
  }

  const orrery = $("#orrery");
  orrery.insertAdjacentHTML("afterbegin", ringMarkup());
  const ring = orrery.querySelector(".ring");

  const globe = terrella.createGlobe($("#globe"), {
    world, regions: REGIONS, markers: MARKERS,
    style: state.style,
    projection: state.projection,
    palette: PALETTES[state.palette].colors,
    labels: { markers: true },
    onMarkerHover: (m) => { $("#r-hover").textContent = m ? m.name : "none"; },
    onCountryHover: (c) => { $("#r-hover").textContent = c ? c.name : "none"; },
  });
  if (state.region) globe.focus(state.region, { duration: 0 });
  if (state.projection !== "orthographic") ring.style.opacity = "0";

  const styleHost = $("#c-style");
  for (const name of terrella.STYLE_NAMES) {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.style = name;
    button.setAttribute("aria-pressed", String(name === state.style));
    button.textContent = name[0].toUpperCase() + name.slice(1);
    styleHost.appendChild(button);
  }
  for (const button of document.querySelectorAll("#c-projection button")) {
    button.setAttribute("aria-pressed", String(button.dataset.projection === state.projection));
  }
  $("#c-region").value = state.region;

  setInterval(() => {
    $("#r-longitude").textContent = `${globe.longitude.toFixed(2)}°`;
  }, 120);

  function renderCode() {
    const lines = [`const globe = createGlobe(el, {`, `  world,`];
    if (state.style !== "solid") lines.push(`  style: "${state.style}",`);
    if (state.projection !== "orthographic") lines.push(`  projection: "${state.projection}",`);
    if (state.palette !== base()) lines.push(`  palette: ${state.palette}Palette,`);
    lines.push(`  regions, markers,`, `});`);
    if (state.region) lines.push(``, `globe.focus("${state.region}");`);
    $("#live-code").textContent = lines.join("\n");
  }

  function wireGroup(id, key, apply) {
    const group = $(id);
    group.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      for (const other of group.querySelectorAll("button")) {
        other.setAttribute("aria-pressed", String(other === button));
      }
      state[key] = button.dataset[key];
      apply(state[key]);
      renderCode();
      writeUrl();
    });
  }

  const paletteHost = $("#c-palette");
  for (const [id, palette] of Object.entries(PALETTES)) {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.palette = id;
    button.setAttribute("aria-pressed", String(id === state.palette));
    button.innerHTML = `<span class="chip" style="background:${palette.swatch}" aria-hidden="true"></span>${palette.label}`;
    paletteHost.appendChild(button);
  }

  wireGroup("#c-style", "style", (v) => globe.setStyle(v));
  wireGroup("#c-projection", "projection", (v) => {
    globe.setProjection(v);
    // The ring is a meridian; it means nothing around a flat map.
    gsap.to(ring, { opacity: v === "orthographic" ? 1 : 0, duration: reduced ? 0 : 0.4 });
  });
  wireGroup("#c-palette", "palette", (v) => globe.setPalette(PALETTES[v].colors));

  $("#c-region").addEventListener("change", (event) => {
    state.region = event.target.value;
    globe.focus(state.region || null);
    renderCode();
    writeUrl();
  });

  renderCode();

  theme.bindSwitch($("#theme-toggle"));
  theme.onChange(() => {
    // Follow the page unless a palette was chosen on purpose.
    if (state.palette === "chart" || state.palette === "ink") {
      state.palette = base();
      globe.setPalette(PALETTES[state.palette].colors);
      for (const b of paletteHost.querySelectorAll("button")) {
        b.setAttribute("aria-pressed", String(b.dataset.palette === state.palette));
      }
      renderCode();
    }
  });

  if (!reduced) {
    gsap.from(".section-title, .section-lede, .playground-controls", {
      y: 16, opacity: 0, duration: 0.9, ease: "power3.out", stagger: 0.08,
    });
    gsap.from("#orrery", { opacity: 0, scale: 0.97, duration: 1.2, ease: "power3.out" });
  }

  // Exposed so the headless visual checks can drive the demo.
  window.__globe = globe;
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
